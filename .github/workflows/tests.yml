name: Calculation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check custom_components/irpat_efficiency/frontend/panel.js
      - run: node scripts/check_ui_contracts.mjs
      - run: node scripts/test_panel_behavior.mjs
      - run: python scripts/check_package.py
      - name: Build private installation candidate
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/irpat-efficiency-${GITHUB_SHA}.zip" HEAD custom_components/irpat_efficiency hacs.json README.md LICENSE IMPLEMENTATION_STATUS.md
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Upload candidate (not a release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: irpat-efficiency-candidate-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
