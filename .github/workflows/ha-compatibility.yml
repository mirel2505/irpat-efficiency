name: Home Assistant Core compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: '2026.10.4'
            test_package: 'pytest-homeassistant-custom-component==0.13.375'
          - core: '2026.11.2'
            test_package: 'pytest-homeassistant==2026.11.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true
      - name: Install matching Core and test harness
        env:
          HA_CORE: ${{ matrix.core }}
          TEST_PACKAGE: ${{ matrix.test_package }}
        run: python -m pip install "homeassistant==$HA_CORE" "$TEST_PACKAGE"
      - name: Verify pinned version and run integration smoke test
        env:
          HA_CORE: ${{ matrix.core }}
        run: |
          python -c 'from importlib.metadata import version; import os, sys; assert sys.version_info >= (3, 14, 2); assert version("homeassistant") == os.environ["HA_CORE"]'
          python -m pytest tests_ha -v -p no:respx -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -o pythonpath=.
